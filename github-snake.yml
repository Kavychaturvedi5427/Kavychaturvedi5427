name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation (warm gold/coffee palette)
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Kavychaturvedi5427
          outputs: |
            dist/github-snake.svg?color_snake=%23c9822f&color_dots=%23f3e2bd,%23e2c184,%23c9822f,%23a85a2c,%232b1b10
            dist/github-snake-dark.svg?color_snake=%23e0b155&color_dots=%232b1b10,%23573c22,%23a85a2c,%23c9822f,%23f3e2bd

      - name: Push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
