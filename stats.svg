<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-label="Kavya Chaturvedi GitHub stats">
<title>Kavya Chaturvedi &#8211; GitHub Stats</title>
<defs>
  <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fffbf3"/>
    <stop offset="100%" stop-color="#f3e2bd"/>
  </linearGradient>
  <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#c9822f"/>
    <stop offset="100%" stop-color="#a85a2c"/>
  </linearGradient>
  <clipPath id="statsClip"><rect x="0" y="0" width="480" height="300" rx="20"/></clipPath>
  <filter id="ringGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g clip-path="url(#statsClip)">
<rect x="0" y="0" width="480" height="300" fill="url(#statsBg)"/>
<circle cx="440" cy="20" r="120" fill="#e8cfa0" opacity="0.25" filter="url(#ringGlow)"/>
<circle cx="20" cy="280" r="90" fill="#d9b98a" opacity="0.2" filter="url(#ringGlow)"/>

<text x="30" y="34" font-family="'Segoe UI',sans-serif" font-size="15" font-weight="800" fill="#3d2314">Developer Snapshot</text>
<text x="30" y="52" font-family="'Segoe UI',sans-serif" font-size="10.5" fill="#8a6f52">github.com/Kavychaturvedi5427</text>

<circle cx="110" cy="150" r="82" fill="none" stroke="#e6d4ac" stroke-width="14"/>
<circle cx="110" cy="150" r="82" fill="none" stroke="url(#ringGrad)" stroke-width="14" stroke-linecap="round"
  transform="rotate(-90 110 150)" stroke-dasharray="515.22" stroke-dashoffset="515.22" filter="url(#ringGlow)">
  <animate attributeName="stroke-dashoffset" from="515.22" to="123.65" begin="0.4s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
</circle>
<text x="110" y="146" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="34" font-weight="800" fill="#3d2314" opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.5s" fill="freeze"/>
  19
</text>
<text x="110" y="172" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="11.5" fill="#8a6f52" opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.5s" fill="freeze"/>
  Public Repos
</text>

<g transform="translate(30,0)" opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="0.90s" dur="0.5s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" from="70,0" to="0,0" begin="0.90s" dur="0.5s" fill="freeze" additive="replace" calcMode="spline" keySplines="0.25 0.8 0.25 1"/>
  <circle cx="240" cy="57" r="4.5" fill="#c9822f"/>
  <text x="255" y="62" font-family="'Segoe UI',sans-serif" font-size="14" fill="#6b4a30">Public Repos</text>
  <text x="440" y="62" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="15" font-weight="800" fill="#3d2314">19</text>
  <line x1="240" y1="76" x2="440" y2="76" stroke="#e6d4ac" stroke-width="1"/>
</g><g transform="translate(30,0)" opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="1.08s" dur="0.5s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" from="70,0" to="0,0" begin="1.08s" dur="0.5s" fill="freeze" additive="replace" calcMode="spline" keySplines="0.25 0.8 0.25 1"/>
  <circle cx="240" cy="103" r="4.5" fill="#a85a2c"/>
  <text x="255" y="108" font-family="'Segoe UI',sans-serif" font-size="14" fill="#6b4a30">Followers</text>
  <text x="440" y="108" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="15" font-weight="800" fill="#3d2314">12</text>
  <line x1="240" y1="122" x2="440" y2="122" stroke="#e6d4ac" stroke-width="1"/>
</g><g transform="translate(30,0)" opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="1.26s" dur="0.5s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" from="70,0" to="0,0" begin="1.26s" dur="0.5s" fill="freeze" additive="replace" calcMode="spline" keySplines="0.25 0.8 0.25 1"/>
  <circle cx="240" cy="149" r="4.5" fill="#6b8a68"/>
  <text x="255" y="154" font-family="'Segoe UI',sans-serif" font-size="14" fill="#6b4a30">Following</text>
  <text x="440" y="154" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="15" font-weight="800" fill="#3d2314">10</text>
  <line x1="240" y1="168" x2="440" y2="168" stroke="#e6d4ac" stroke-width="1"/>
</g><g transform="translate(30,0)" opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="1.44s" dur="0.5s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" from="70,0" to="0,0" begin="1.44s" dur="0.5s" fill="freeze" additive="replace" calcMode="spline" keySplines="0.25 0.8 0.25 1"/>
  <circle cx="240" cy="195" r="4.5" fill="#8a6f52"/>
  <text x="255" y="200" font-family="'Segoe UI',sans-serif" font-size="14" fill="#6b4a30">Building since</text>
  <text x="440" y="200" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="15" font-weight="800" fill="#3d2314">Aug 2023</text>
  <line x1="240" y1="214" x2="440" y2="214" stroke="#e6d4ac" stroke-width="1"/>
</g>

<rect x="0.75" y="0.75" width="478.5" height="298.5" rx="19" fill="none" stroke="#c9822f" stroke-opacity="0.35" stroke-width="1.5"/>
</g>
</svg>